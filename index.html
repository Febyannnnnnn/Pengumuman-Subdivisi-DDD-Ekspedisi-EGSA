<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#78c4ae">
  <title>DDD Ekspedisi EGSA 2027 — Pengumuman Subdivisi DDD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Rye&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="paper-grain" aria-hidden="true"></div>
  <main class="page">
    <header class="hero">
      <div class="hero-art" aria-hidden="true"></div>
      <div class="hero-copy">
        <p class="eyebrow">PENGUMUMAN SUBDIVISI DDD</p>
        <h1>DDD <span>2027</span></h1>
        <p class="subtitle">Ditunggu sajiannya dddolan imup.</p>
      </div>
      <img class="asset-strip" src="assets/original-asset-set.png" alt="" aria-hidden="true">
    </header>

    <section class="announcement-card" aria-label="Cek pengumuman penempatan">
      <div class="card-topline"><span>HASIL PENEMPATAN</span><span class="tiny-star">✳</span></div>
      <p class="intro">Masukkan nama panggilan untuk melihat hasil penempatanmu di Subdivisi DDD Ekspedisi EGSA 2027.</p>
      <form id="formNama">
        <label for="nama">Nama panggilan</label>
        <input id="nama" name="nama" type="text" placeholder="Contoh: Annisa" autocomplete="given-name" required>
        <button type="submit">UNGKAP HASIL <span aria-hidden="true">✦</span></button>
      </form>
      <div id="hasil" class="result" aria-live="polite"></div>
      <p class="card-foot">SELAMAT BERDINAMIKA BES</p>
    </section>

    <footer class="footer">
      <span>DDD EKSPEDISI EGSA 2027</span>
      <span class="footer-flower" aria-hidden="true">✿</span>
      <span>SUBDIVISI DDD</span>
    </footer>
  </main>
  <div id="confettiLayer" class="confetti-layer" aria-hidden="true"></div>
  <script src="script.js"></script>
</body>
</html>
